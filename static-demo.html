<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vue Hand Note · Standalone Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 72px 24px;
        color: #172033;
        background: #f4f0e8;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      main { width: min(960px, 100%); margin: 0 auto; }
      h1 { margin: 0 0 12px; font-size: clamp(3rem, 8vw, 6rem); letter-spacing: -0.06em; }
      .intro { max-width: 680px; margin: 0 0 72px; color: #596174; font-size: 1.16rem; line-height: 1.7; }
      .demo {
        display: grid;
        min-height: 430px;
        place-items: center;
        border: 1px solid rgb(23 32 51 / 12%);
        border-radius: 28px;
        padding: 100px 48px;
        background: rgb(255 255 255 / 82%);
        box-shadow: 0 24px 70px rgb(65 50 29 / 12%);
      }
      .line { margin: 0; font: 1.05rem/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 72px; }
      .cell {
        display: grid;
        min-height: 190px;
        place-items: center;
        border: 1px solid rgb(23 32 51 / 10%);
        border-radius: 18px;
        background: rgb(255 255 255 / 72%);
      }
      @media (max-width: 760px) { .grid { grid-template-columns: repeat(2, 1fr); } }
      @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } .line { font-size: 0.78rem; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Vue Hand Note</h1>
      <p class="intro">A standalone demo with no build step. Each custom element renders a handwritten note, a subtle highlight, and a precisely anchored arrow.</p>

      <section class="demo">
        <p class="line">
          - [ ]
          <hand-note note="stable ID" direction="top" color="blue">CLI-042</hand-note>
          Add export command
          <hand-note note="priority" direction="top-right" color="red">!high</hand-note>
        </p>
      </section>

      <section class="grid" aria-label="All directions">
        <div class="cell"><hand-note note="Top left" direction="top-left" color="amber">target</hand-note></div>
        <div class="cell"><hand-note note="Top" direction="top" color="blue">target</hand-note></div>
        <div class="cell"><hand-note note="Top right" direction="top-right" color="green">target</hand-note></div>
        <div class="cell"><hand-note note="Left" direction="left" color="red">target</hand-note></div>
        <div class="cell"><hand-note note="Right" direction="right" color="purple">target</hand-note></div>
        <div class="cell"><hand-note note="Bottom left" direction="bottom-left" color="blue">target</hand-note></div>
        <div class="cell"><hand-note note="Bottom" direction="bottom" color="green">target</hand-note></div>
        <div class="cell"><hand-note note="Bottom right" direction="bottom-right" color="amber">target</hand-note></div>
      </section>
    </main>

    <script>
      const aliases = { n: 'top', ne: 'top-right', e: 'right', se: 'bottom-right', s: 'bottom', sw: 'bottom-left', w: 'left', nw: 'top-left' }
      const colors = { amber: '#d97706', blue: '#2563eb', green: '#15803d', red: '#dc2626', purple: '#7c3aed' }
      const angles = {
        left: 0, 'top-left': 45, top: 90, 'top-right': 135,
        right: 180, 'bottom-right': 225, bottom: 270, 'bottom-left': 315
      }

      class HandNoteElement extends HTMLElement {
        connectedCallback() {
          const rawDirection = this.getAttribute('direction') || 'top'
          const direction = aliases[rawDirection] || rawDirection
          const colorName = this.getAttribute('color') || 'blue'
          const color = colors[colorName] || colorName
          const note = this.getAttribute('note') || ''
          const angle = angles[direction]
          const content = this.innerHTML
          this.attachShadow({ mode: 'open' }).innerHTML = `
            <style>
              :host { --c: ${color}; --gap: 8px; position: relative; display: inline-flex; vertical-align: baseline; isolation: isolate; }
              .target { position: relative; z-index: 1; display: inline-flex; border-radius: .2em; background: color-mix(in srgb, var(--c) 9%, transparent); box-shadow: 0 0 0 .13em color-mix(in srgb, var(--c) 8%, transparent); }
              svg { position: absolute; z-index: 2; width: 96px; height: 96px; overflow: visible; color: var(--c); pointer-events: none; transform: translate(-88px, -48px); }
              path { fill: none; stroke: currentColor; stroke-width: 2.15; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
              .ghost { opacity: .22; stroke-width: 1.35; }
              .label { position: absolute; z-index: 3; color: var(--c); white-space: nowrap; font: 560 .86em/1.1 "Shantell Sans", "Comic Sans MS", cursive; transform: rotate(-3deg); pointer-events: none; }
              :host([direction="left"]) svg, :host([direction="w"]) svg { left: calc(0% - var(--gap)); top: 50%; }
              :host([direction="right"]) svg, :host([direction="e"]) svg { left: calc(100% + var(--gap)); top: 50%; }
              :host([direction="top"]) svg, :host([direction="n"]) svg { left: 50%; top: calc(0% - var(--gap)); }
              :host([direction="bottom"]) svg, :host([direction="s"]) svg { left: 50%; top: calc(100% + var(--gap)); }
              :host([direction="top-left"]) svg, :host([direction="nw"]) svg { left: calc(0% - var(--gap)); top: calc(0% - var(--gap)); }
              :host([direction="top-right"]) svg, :host([direction="ne"]) svg { left: calc(100% + var(--gap)); top: calc(0% - var(--gap)); }
              :host([direction="bottom-left"]) svg, :host([direction="sw"]) svg { left: calc(0% - var(--gap)); top: calc(100% + var(--gap)); }
              :host([direction="bottom-right"]) svg, :host([direction="se"]) svg { left: calc(100% + var(--gap)); top: calc(100% + var(--gap)); }
              :host([direction="top"]) .label, :host([direction="n"]) .label { left: 50%; bottom: calc(100% + var(--gap) + 72px); transform: translateX(-50%) rotate(-3deg); }
              :host([direction="bottom"]) .label, :host([direction="s"]) .label { left: 50%; top: calc(100% + var(--gap) + 72px); transform: translateX(-50%) rotate(-3deg); }
              :host([direction="left"]) .label, :host([direction="w"]) .label { right: calc(100% + var(--gap) + 72px); top: 50%; transform: translateY(-50%) rotate(-3deg); }
              :host([direction="right"]) .label, :host([direction="e"]) .label { left: calc(100% + var(--gap) + 72px); top: 50%; transform: translateY(-50%) rotate(-3deg); }
              :host([direction="top-left"]) .label, :host([direction="nw"]) .label { right: calc(100% + var(--gap) + 51px); bottom: calc(100% + var(--gap) + 51px); }
              :host([direction="top-right"]) .label, :host([direction="ne"]) .label { left: calc(100% + var(--gap) + 51px); bottom: calc(100% + var(--gap) + 51px); }
              :host([direction="bottom-left"]) .label, :host([direction="sw"]) .label { right: calc(100% + var(--gap) + 51px); top: calc(100% + var(--gap) + 51px); }
              :host([direction="bottom-right"]) .label, :host([direction="se"]) .label { left: calc(100% + var(--gap) + 51px); top: calc(100% + var(--gap) + 51px); }
            </style>
            <span class="target">${content}</span>
            <svg viewBox="0 0 96 96" aria-hidden="true"><g transform="rotate(${angle} 88 48)"><path class="ghost" transform="translate(.7 .6)" d="M 12 38 C 31 19 48 63 69 48 C 77 42 82 45 88 48"></path><path d="M 12 38 C 31 19 48 63 69 48 C 77 42 82 45 88 48"></path><path d="M 81 39.5 L 88 48 L 77 47.5"></path></g></svg>
            <span class="label">${note}</span>`
        }
      }

      customElements.define('hand-note', HandNoteElement)
    </script>
  </body>
</html>
